# A1 — λ = 0.1 on C2-style random-mask MAE (ablation). experiment/02_experiment_plan.md §8
# Run: python train.py --config configs/A1_lambda_0.1_C2.yaml

experiment:
  name: A1_lambda_0.1_C2
  notes: "Ablations: lambda sweep on random-mask baseline"
  condition: C2

data:
  libero:
    batch_size: 4
    num_workers: 2
    shuffle: true
    seed: 42
    pin_memory: true

model:
  freeze_backbone: true
  finetune_last_n_layers: 2
  num_patches: 196
  patch_size: 16
  backbone:
    model_id: google/paligemma-3b-pt-224
    torch_dtype: bfloat16
    device_map: null
  reconstruction:
    enabled: true
    lambda_recon: 0.1
    decoder_layers: 4
    decoder_dim: 256
    decoder_heads: 8
  masking:
    mode: random
    mask_ratio: 0.25
    attention_heads: all
    attention_layers: last_3
    selected_heads: null
    head_selection_file: null
    mask_source: student
    topology: default
  ema:
    enabled: false
    decay: 0.999

training:
  epochs: 20
  batch_size: 8
  batches_per_epoch: 500
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: cuda
  seed: 42
  use_experiment_preset: false
  mixed_precision: true
  log_every_n_steps: 10
  checkpoint_dir: ./checkpoints/A1_lambda_0.1_C2
  val_batches: 50
  resume_from: null
  best_checkpoint_metric: train_loss

logging:
  wandb:
    enabled: false
    project: la-reconvla
    tags: [A1, C2, lambda_0.1]
