# C1 — Action-only baseline (no MAE, no masking). experiment/02_experiment_plan.md §2
# Run: python train.py --config configs/C1.yaml
# W&B: set WANDB_API_KEY (see comments under ``logging``). Use --no-wandb to disable.

experiment:
  name: C1_action_only
  notes: ""
  condition: C1

data:
  libero:
    # Colab T4: keep batch_size modest (PaliGemma 3B + images); lower to 2 if CUDA OOM.
    # pin_memory true + training.device cuda enables fast non_blocking copies to GPU.
    batch_size: 4
    num_workers: 2
    shuffle: true
    seed: 42
    pin_memory: true

model:
  freeze_backbone: true
  finetune_last_n_layers: 2
  num_patches: 196
  patch_size: 16
  backbone:
    model_id: google/paligemma2-3b-mix-224
    torch_dtype: bfloat16
    device_map: null
  reconstruction:
    enabled: false
    lambda_recon: 0.0
    decoder_layers: 4
    decoder_dim: 256
    decoder_heads: 8
  masking:
    mode: none
    mask_ratio: 0.25
    attention_heads: all
    attention_layers: last_3
    selected_heads: null
    head_selection_file: null
    mask_source: student
    topology: default
  ema:
    enabled: false
    decay: 0.999

training:
  epochs: 20
  batch_size: 8
  batches_per_epoch: 500
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: cuda
  seed: 42
  use_experiment_preset: false
  mixed_precision: true
  log_every_n_steps: 10
  checkpoint_dir: ./checkpoints/C1
  val_batches: 50
  resume_from: null
  best_checkpoint_metric: train_loss

# W&B: set WANDB_API_KEY in your environment (recommended). For a local-only key in YAML use ``api_key: ...``
# (do not commit secrets). Omit ``run_name`` for an automatic unique name per launch.
logging:
  wandb:
    enabled: true
    project: La-ReconVLA
    tags: [C1]
