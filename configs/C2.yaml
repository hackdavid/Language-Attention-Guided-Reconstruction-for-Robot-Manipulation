# C2 — Random-mask MAE, 25% patches, λ_recon = 0.5. experiment/02_experiment_plan.md §2
# Run: python train.py --config configs/C2.yaml

experiment:
  name: C2_random_mae
  notes: ""
  condition: C2

data:
  libero:
    batch_size: 8
    num_workers: 4
    shuffle: true
    seed: 42
    pin_memory: true

model:
  freeze_backbone: true
  finetune_last_n_layers: 2
  num_patches: 196
  patch_size: 16
  backbone:
    model_id: /kaggle/input/models/google/paligemma-2/transformers/paligemma2-3b-mix-224/1
    torch_dtype: bfloat16
    device_map: null
  reconstruction:
    enabled: true
    lambda_recon: 0.5
    decoder_layers: 4
    decoder_dim: 256
    decoder_heads: 8
  masking:
    mode: random
    mask_ratio: 0.25
    attention_heads: all
    attention_layers: last_3
    selected_heads: null
    head_selection_file: null
    mask_source: student
    topology: default
  ema:
    enabled: false
    decay: 0.999

training:
  epochs: 3
  batch_size: 32
  batches_per_epoch: 500
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: cuda
  seed: 42
  use_experiment_preset: false
  mixed_precision: true
  log_every_n_steps: 10
  checkpoint_dir: ./checkpoints/C2
  val_batches: 50
  resume_from: null
  best_checkpoint_metric: train_loss

logging:
  wandb:
    enabled: false
    project: La-ReconVLA
    tags: [C2]
