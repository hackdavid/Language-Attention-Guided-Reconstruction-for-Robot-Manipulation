# C3 — Naive attention-mask MAE (all-head saliency, top 25%). experiment/02_experiment_plan.md §2
# Run: python train.py --config configs/C3.yaml

experiment:
  name: C3_attention_naive_mae
  notes: ""
  condition: C3

data:
  libero:
    # Kaggle: use ONE path only, e.g. local_root: /kaggle/working/libero_spatial_image
    # (do not concatenate .../libero_spatial_image/kaggle/working/...).
    skip_snapshot_download: true
    batch_size: 6
    num_workers: 2
    shuffle: true
    seed: 42
    pin_memory: true

model:
  freeze_backbone: true
  finetune_last_n_layers: 2
  # PaliGemma2-224: 256 image tokens, 14×14 grid @ 224² (auto-aligned in code if backbone differs).
  num_patches: 256
  patch_size: 14
  backbone:
    model_id: /kaggle/input/models/google/paligemma-2/transformers/paligemma2-3b-mix-224/1
    torch_dtype: bfloat16
    device_map: null
  reconstruction:
    enabled: true
    lambda_recon: 0.5
    decoder_layers: 4
    decoder_dim: 256
    decoder_heads: 8
  masking:
    mode: attention_naive
    mask_ratio: 0.25
    attention_heads: all
    attention_layers: last_3
    selected_heads: null
    head_selection_file: null
    mask_source: student
    topology: default
  ema:
    enabled: false
    decay: 0.999

training:
  epochs: 3
  batch_size: 4
  batches_per_epoch: 500
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: cuda
  seed: 42
  use_experiment_preset: false
  mixed_precision: true
  log_every_n_steps: 100
  checkpoint_dir: ./checkpoints/C3
  val_batches: 50
  resume_from: null
  best_checkpoint_metric: train_loss

logging:
  wandb:
    enabled: true
    project: La-ReconVLA
    tags: [C3]
