# C4 — Selected-head attention-mask MAE. Replace model.masking.selected_heads after Step 1 diagnostic.
# Run: python train.py --config configs/C4.yaml

experiment:
  name: C4_selected_heads_mae
  notes: ""
  condition: C4

data:
  libero:
    # Kaggle/offline: skip Hub snapshot; set local_root to ONE directory (no chained paths).
    skip_snapshot_download: true
    batch_size: 8
    num_workers: 2
    shuffle: true
    seed: 42
    pin_memory: true

model:
  freeze_backbone: true
  finetune_last_n_layers: 2
  # PaliGemma2-224: 256 image tokens, 14×14 grid @ 224² (auto-aligned in code if backbone differs).
  num_patches: 256
  patch_size: 14
  backbone:
    model_id: /kaggle/input/models/google/paligemma-2/transformers/paligemma2-3b-mix-224/1
    torch_dtype: bfloat16
    device_map: null
  reconstruction:
    enabled: true
    lambda_recon: 0.5
    decoder_layers: 4
    decoder_dim: 256
    decoder_heads: 8
  masking:
    mode: attention_selected
    mask_ratio: 0.25
    attention_heads: all
    attention_layers: last_3
    # Indices must exist in LM num_heads (e.g. 0..7 for 8-head layers). Replace after diagnostic.
    selected_heads: [0, 1, 2]
    head_selection_file: null
    mask_source: student
    topology: default
  ema:
    enabled: false
    decay: 0.999

training:
  epochs: 3
  batch_size: 16
  batches_per_epoch: 500
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: cuda
  seed: 42
  use_experiment_preset: false
  mixed_precision: true
  log_every_n_steps: 100
  checkpoint_dir: ./checkpoints/C4
  val_batches: 50
  resume_from: null
  best_checkpoint_metric: train_loss

logging:
  wandb:
    enabled: true
    project: La-ReconVLA
    tags: [C4]
