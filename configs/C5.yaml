# C5 — Same as C4 but patch masks from EMA teacher vision tower. Update selected_heads after diagnostic.
# Run: python train.py --config configs/C5.yaml

experiment:
  name: C5_ema_teacher_masks
  notes: ""
  condition: C5

data:
  libero:
    batch_size: 4
    num_workers: 2
    shuffle: true
    seed: 42
    pin_memory: true

model:
  freeze_backbone: true
  finetune_last_n_layers: 2
  # PaliGemma2-224: 256 image tokens, 14×14 grid @ 224² (auto-aligned in code if backbone differs).
  num_patches: 256
  patch_size: 14
  backbone:
    model_id: google/paligemma2-3b-mix-224
    torch_dtype: bfloat16
    device_map: null
  reconstruction:
    enabled: true
    lambda_recon: 0.5
    decoder_layers: 4
    decoder_dim: 256
    decoder_heads: 8
  masking:
    mode: attention_selected
    mask_ratio: 0.25
    attention_heads: all
    attention_layers: last_3
    selected_heads: [0, 1, 2]
    head_selection_file: null
    mask_source: ema_teacher
    topology: default
  ema:
    enabled: true
    decay: 0.999

training:
  epochs: 20
  batch_size: 8
  batches_per_epoch: 500
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: cuda
  seed: 42
  use_experiment_preset: false
  mixed_precision: true
  log_every_n_steps: 10
  checkpoint_dir: ./checkpoints/C5
  val_batches: 50
  resume_from: null
  best_checkpoint_metric: train_loss

logging:
  wandb:
    enabled: false
    project: La-ReconVLA
    tags: [C5]
