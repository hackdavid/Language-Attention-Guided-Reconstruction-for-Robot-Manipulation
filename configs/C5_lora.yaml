# C5 + LoRA — EMA teacher masks + PEFT on PaliGemma2 (SigLIP + projector + Gemma2 linears; see C3_lora header).
# Requires: pip install -U "peft>=0.13"
# Run: python train.py --config configs/C5_lora.yaml
#
# Override backbone.model_id for local/HF, e.g. google/paligemma2-3b-mix-224

experiment:
  name: C5_ema_teacher_masks_lora
  notes: "C5 + LoRA (VM+LM+projector). OOM → lower training.batch_size or drop MLP lines from model.lora.target_modules."
  condition: C5

data:
  libero:
    skip_snapshot_download: true
    batch_size: 2
    num_workers: 2
    shuffle: true
    seed: 42
    pin_memory: true

model:
  freeze_backbone: true
  finetune_last_n_layers: 2
  num_patches: 256
  patch_size: 14
  backbone:
    model_id: /kaggle/input/models/google/paligemma-2/transformers/paligemma2-3b-mix-224/1
    torch_dtype: bfloat16
    device_map: null
  lora:
    enabled: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - out_proj
      - o_proj
      - linear
      - fc1
      - fc2
      - gate_proj
      - up_proj
      - down_proj
  reconstruction:
    enabled: true
    lambda_recon: 0.5
    decoder_layers: 4
    decoder_dim: 256
    decoder_heads: 8
  masking:
    mode: attention_selected
    mask_ratio: 0.25
    attention_heads: all
    attention_layers: last_3
    selected_heads: [0, 1, 2]
    head_selection_file: null
    mask_source: ema_teacher
    topology: default
  ema:
    enabled: true
    decay: 0.999

training:
  epochs: 1
  batches_per_epoch: 500
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: cuda
  seed: 42
  use_experiment_preset: false
  mixed_precision: true
  log_every_n_steps: 100
  checkpoint_dir: ./checkpoints/C5_lora
  val_batches: 50
  resume_from: null
  best_checkpoint_metric: train_loss

logging:
  wandb:
    enabled: true
    project: La-ReconVLA
    tags: [C5, lora]
