# Merge with a base config to enable LoRA, e.g.:
#   python train.py --config configs/C2.yaml configs/lora_overlay.example.yaml
#
# PaliGemma2: q/k/v_proj hit SigLIP + Gemma2; out_proj=vision attn out; o_proj=LM attn out;
# linear=multi_modal_projector; fc1/fc2=SigLIP MLP; gate/up/down_proj=Gemma2 MLP.
# pip install -U "peft>=0.13"

model:
  lora:
    enabled: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: none
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - out_proj
      - o_proj
      - linear
      - fc1
      - fc2
      - gate_proj
      - up_proj
      - down_proj
